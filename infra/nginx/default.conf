# Internal edge for docker compose. FastPanel terminates TLS and proxies here.
resolver 127.0.0.11 valid=10s ipv6=off;

log_format fsp '$remote_addr "$request" $status '
               'host="$host" conn="$http_connection" '
               'upg="$http_upgrade" ua="$http_user_agent" '
               'xff="$http_x_forwarded_for"';

server {
  listen 80;
  server_tokens off;
  client_max_body_size 12m;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  access_log /var/log/nginx/access.log fsp;

  set $backend_upstream http://backend:3001;
  set $frontend_upstream http://frontend:3000;

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}
